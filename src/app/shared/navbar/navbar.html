<nav class="navbar">
  <div class="navbar-container">
    <!-- Logo/Brand -->
    <div class="navbar-brand">
      <a routerLink="/" class="logo">
        <span class="logo-icon"></span>
        <span class="logo-text">Lois Ajani</span>
      </a>
    </div>

    <!-- Mobile Menu Toggle -->
    <button 
      class="mobile-toggle"
      (click)="toggleMobileMenu()"
      [class.active]="mobileMenuOpen"
      aria-label="Toggle menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Navigation Links -->
    <ul class="nav-links" [class.active]="mobileMenuOpen">
      <li><a routerLink="/home" routerLinkActive="active" (click)="mobileMenuOpen = false">Home</a></li>
      <li><a routerLink="/projects" routerLinkActive="active" (click)="mobileMenuOpen = false">Projects</a></li>
      <li><a routerLink="/about" routerLinkActive="active" (click)="mobileMenuOpen = false">About</a></li>
      <li><a routerLink="/contact" routerLinkActive="active" (click)="mobileMenuOpen = false">Contact</a></li>
    </ul>

    <!-- Right Side Actions (Desktop) -->
    <div class="navbar-actions">
      <!-- Admin Panel Link -->
      <a 
        *ngIf="isAuthenticated"
        routerLink="/admin/dashboard"
        class="admin-link"
        title="Admin Dashboard"
      >
        <i class="bi bi-gear"></i> Admin
      </a>

      <!-- User Menu -->
      <div *ngIf="isAuthenticated" class="user-menu">
        <span class="user-name">{{ currentUser?.fullName || currentUser?.email }}</span>
        <button 
          (click)="logout()"
          class="logout-btn"
          title="Logout"
        >
          <i class="bi bi-door-left"></i> Logout
        </button>
      </div>

      <!-- Login Link -->
      <a 
        *ngIf="!isAuthenticated"
        routerLink="/auth/login"
        class="login-link"
      >
        Login
      </a>
    </div>
  </div>

  <!-- Mobile Actions Menu (only visible when mobile menu is open) -->
  <div class="mobile-actions" [class.active]="mobileMenuOpen">
    <!-- Admin Panel Link -->
    <a 
      *ngIf="isAuthenticated"
      routerLink="/admin/dashboard"
      class="mobile-admin-link"
      title="Admin Dashboard"
      (click)="mobileMenuOpen = false"
    >
      <i class="bi bi-gear"></i> Admin Dashboard
    </a>

    <!-- User Info -->
    <div *ngIf="isAuthenticated" class="mobile-user-info">
      <span class="mobile-user-name">{{ currentUser?.fullName || currentUser?.email }}</span>
    </div>

    <!-- Logout Button -->
    <button 
      *ngIf="isAuthenticated"
      (click)="logout()"
      class="mobile-logout-btn"
      title="Logout"
    >
      <i class="bi bi-door-left"></i> Logout
    </button>

    <!-- Login Link -->
    <a 
      *ngIf="!isAuthenticated"
      routerLink="/auth/login"
      class="mobile-login-link"
      (click)="mobileMenuOpen = false"
    >
      <i class="bi bi-box-arrow-in-right"></i> Login
    </a>
  </div>
</nav>
